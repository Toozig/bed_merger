[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bed-file-merger"
version = "0.1.0"
description = "BED file analysis CLI: stats and optional RefSeq coding-region overlap"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Gonen Lab" }]
license = { text = "MIT" }
keywords = ["BED", "genomics", "ATAC-seq", "refseq", "coding", "bedtools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]

dependencies = [
  "pandas>=2.0.0",
  "numpy<2",
  "openpyxl>=3.1.0",
  "pydantic>=2.5.0",
  "typer>=0.12.0",
  "gtfparse>=2.5.0",
  "pybedtools>=0.9.1",
]

[project.scripts]
bed-merge-report = "bed_file_merger.cli:main"
bed-extract-coding = "bed_file_merger.cli:main"

[tool.setuptools.packages.find]
include = ["bed_file_merger*"]

[tool.setuptools.package-data]
bed_file_merger = [
  "resources/*.json",
]

