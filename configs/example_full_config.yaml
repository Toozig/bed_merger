# =============================================================================
# BED File Merger - Complete Configuration Example
# =============================================================================
# This file demonstrates all possible configuration options with explanations.
# Copy and modify this template for your specific analysis needs.

# =============================================================================
# INPUT CONFIGURATION
# =============================================================================
input_config:
  
  # List of BED files to analyze and potentially merge
  bed_files:
    # First BED file
    - path: /absolute/path/to/sample1.bed
      name: "Human scATAC Sample 1"              # Display name in reports
      extra_columns: ['ID']                      # Additional columns beyond chr, start, end
                                                # Common: ['ID'], ['peak_score'], ['ID', 'peak_score']
                                                # Set to null if only 3 columns (chr, start, end)
    
    # Second BED file  
    - path: /absolute/path/to/sample2.bed
      name: "Mouse Converted Sample 2"
      extra_columns: ['peak_score', 'ID']       # Multiple extra columns supported
    
    # Third BED file (minimal - only 3 columns)
    - path: /absolute/path/to/sample3.bed
      name: "Simple BED Sample 3"
      extra_columns: null                       # No extra columns beyond chr, start, end
  
  # GTF file for coding region analysis (RefSeq format recommended)
  refseq_gtf: /absolute/path/to/ncbiRefSeq_hg38.gtf
  
  # Pre-computed coding regions BED file (OPTIONAL)
  # If not provided, will be generated from refseq_gtf
  coding_bed: /absolute/path/to/hg38_coding_regions.bed
  
  # Copy all input files to output directory for provenance (RECOMMENDED for papers)
  copy_input: true                              # true = copy files, false = reference only
  
  # Add unique IDs to each peak (useful for tracking)
  add_id: true                                  # true = generate IDs, false = use existing or none
  
  # Column name for generated IDs (only used if add_id: true)
  id_column_name: "peak_id"                     # Default: "id", can customize name

# =============================================================================
# OUTPUT CONFIGURATION  
# =============================================================================

# Output configuration (grouped)
output_config:
  # Main output directory (will be created if doesn't exist)
  output_dir: /absolute/path/to/analysis_results
  
  # Temporary directory for processing files
  tmp_dir: /tmp                                   # Default: /tmp, can specify custom location
  
  # Base name (no extension). Report -> <name>.xlsx; merged -> <name>.bed (default)
  output_file_name: report

# Genome build for analysis (affects coding region processing)
genome_build: hg38                              # Options: hg38, mm10

# =============================================================================
# MERGE CONFIGURATION (OPTIONAL)
# =============================================================================
# Controls whether input files are merged using bedtools merge

merge:
  # Enable/disable merging functionality
  enabled: true                                 # true = create merged file, false = analysis only
  
  # Output path for merged BED file (OPTIONAL)
  # If omitted, defaults to <output_dir>/<output_file_name>.bed
  # out_path: /absolute/path/to/merged_output.bed
  
  # Additional bedtools merge options (advanced users)
  bedtools_opts: ""                            # Examples: "-d 100" (max distance), "-s" (strand-specific)
                                               # Leave empty for default behavior

# =============================================================================
# CONFIGURATION EXAMPLES FOR DIFFERENT USE CASES
# =============================================================================

# Example 1: Simple analysis (no merging)
# merge:
#   enabled: false

# Example 2: Merge with custom distance  
# merge:
#   enabled: true
#   bedtools_opts: "-d 500"                    # Merge peaks within 500bp

# Example 3: Strand-specific merging
# merge:
#   enabled: true  
#   bedtools_opts: "-s"                        # Only merge overlapping regions on same strand

# =============================================================================
# TYPICAL WORKFLOWS
# =============================================================================

