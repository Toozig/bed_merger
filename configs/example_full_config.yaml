#       extra_columns: ['peak_score']
#     - path: E13.5_peaks.bed
#       name: "E13.5 Developmental Stage"  
#       extra_columns: ['peak_score']

# =============================================================================
# IMPORTANT NOTES
# =============================================================================
#
# 1. FILE PATHS:
#    - Use absolute paths to avoid confusion
#    - Relative paths are interpreted relative to working directory
#    - Ensure all files exist and are readable
#
# 2. BED FILE FORMAT:
#    - Must be tab-separated
#    - Minimum 3 columns: chr, start, end (0-based coordinates)
#    - Extra columns specified in extra_columns parameter
#    - Files should be sorted (will be sorted automatically if not)
#
# 3. GTF FILE:
#    - RefSeq format recommended for best results
#    - Used for coding region overlap analysis
#    - Download from UCSC Genome Browser or NCBI
#
# 4. OUTPUT:
#    - Excel report with individual sheets per input file
#    - Summary statistics with coding region analysis
#    - Optional merged BED file if merge.enabled: true
#    - Input files copied to output_dir/input_files/ if copy_input: true
#
# 5. MEMORY USAGE:
#    - Large BED files may require substantial memory
#    - Ensure sufficient RAM for your dataset size
#    - Use tmp_dir on fast storage for better performance
#
# =============================================================================
